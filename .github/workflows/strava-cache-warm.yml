name: Strava Cache Warm-up (predictor tuning)

# Fills the Strava power-curve cache up to 10 riders per run (~20 Strava reads each:
# only the rides that can hold the peaks are downloaded), so predictor tuning has
# riders to measure against. The backend reads Strava's own usage headers and pauses
# while usage is above 75% of the app's 15-minute or daily
# read limit, so the rest of the app always has room. Once every eligible rider has a
# fresh curve, each run is a no-op that makes no Strava requests.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: strava-cache-warm
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Warm Strava curve cache
        run: |
          response=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "X-Scheduler-Token: ${{ secrets.SCHEDULER_SECRET }}" \
            -H "Content-Type: application/json" \
            --data "{}" \
            https://us-central1-dcu-member-liga-479507.cloudfunctions.net/dcu_api/admin/predictor/strava-cache/warm)
          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/body.txt
          [ "$response" = "200" ] || exit 1
