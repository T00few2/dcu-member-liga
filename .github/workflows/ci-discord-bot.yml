name: Discord bot CI

on:
  push:
    paths:
      - 'discord-bot/**'
  pull_request:
    paths:
      - 'discord-bot/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            discord-bot/requirements.txt
            discord-bot/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 --max-line-length=120 bot tests

      - name: Run tests
        run: python -m pytest -v
