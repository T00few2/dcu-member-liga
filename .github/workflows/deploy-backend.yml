name: Deploy Backend to Google Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Functions (Gen 2)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ZWIFT_USERNAME: ${{ secrets.ZWIFT_USERNAME }}
          ZWIFT_PASSWORD: ${{ secrets.ZWIFT_PASSWORD }}
          ZWIFT_CLIENT_ID: ${{ secrets.ZWIFT_CLIENT_ID }}
          ZWIFT_CLIENT_SECRET: ${{ secrets.ZWIFT_CLIENT_SECRET }}
          ZWIFT_REDIRECT_URI: ${{ secrets.ZWIFT_REDIRECT_URI }}
          ZR_AUTH_KEY: ${{ secrets.ZR_AUTH_KEY }}
          ZR_BASE_URL: ${{ secrets.ZR_BASE_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          ZOHO_SMTP_USER: ${{ secrets.ZOHO_SMTP_USER }}
          ZOHO_SMTP_APP_PASSWORD: ${{ secrets.ZOHO_SMTP_APP_PASSWORD }}
          ZOHO_CAMPAIGNS_CLIENT_ID: ${{ secrets.ZOHO_CAMPAIGNS_CLIENT_ID }}
          ZOHO_CAMPAIGNS_CLIENT_SECRET: ${{ secrets.ZOHO_CAMPAIGNS_CLIENT_SECRET }}
          ZOHO_CAMPAIGNS_REFRESH_TOKEN: ${{ secrets.ZOHO_CAMPAIGNS_REFRESH_TOKEN }}
          ZOHO_CAMPAIGNS_FROM_EMAIL: ${{ secrets.ZOHO_CAMPAIGNS_FROM_EMAIL }}
          ZOHO_CAMPAIGNS_TOPIC_ID: ${{ secrets.ZOHO_CAMPAIGNS_TOPIC_ID }}
          ZOHO_CAMPAIGNS_LIST_KEY: ${{ secrets.ZOHO_CAMPAIGNS_LIST_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
        run: |
          python - <<'PY'
          import json, os, sys
          required = [
              "GCP_PROJECT_ID",
              "STRAVA_CLIENT_ID", "STRAVA_CLIENT_SECRET",
              "BACKEND_URL", "FRONTEND_URL",
              "ZWIFT_USERNAME", "ZWIFT_PASSWORD",
              "ZWIFT_CLIENT_ID", "ZWIFT_CLIENT_SECRET", "ZWIFT_REDIRECT_URI",
              "ZR_AUTH_KEY", "ZR_BASE_URL", "SCHEDULER_SECRET",
              "ZOHO_SMTP_USER", "ZOHO_SMTP_APP_PASSWORD",
              "ZOHO_CAMPAIGNS_CLIENT_ID", "ZOHO_CAMPAIGNS_CLIENT_SECRET",
              "ZOHO_CAMPAIGNS_REFRESH_TOKEN", "ZOHO_CAMPAIGNS_FROM_EMAIL",
          ]
          # ANTHROPIC_API_KEY: used by the division agent; optional until that feature is enabled.
          # DISCORD_*/BOT_SHARED_SECRET: Discord linking and the help-channel bot; optional until set up.
          optional = ["ZOHO_CAMPAIGNS_TOPIC_ID", "ZOHO_CAMPAIGNS_LIST_KEY", "ANTHROPIC_API_KEY",
                      "DISCORD_CLIENT_ID", "DISCORD_CLIENT_SECRET", "BOT_SHARED_SECRET"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing GitHub repository secrets: " + ", ".join(missing), file=sys.stderr)
              print("Secrets stored on a GitHub Environment are not visible to this job.", file=sys.stderr)
              sys.exit(1)
          path = os.environ["RUNNER_TEMP"] + "/dcu-api-env.yaml"
          with open(path, "w", encoding="utf-8") as handle:
              for name in required + optional:
                  if name == "GCP_PROJECT_ID":
                      continue
                  value = os.environ.get(name, "")
                  if name in optional and not value:
                      continue
                  handle.write(f"{name}: {json.dumps(value)}\n")
          print("Wrote env file with keys: " + ", ".join(required[1:] + optional))
          PY
          gcloud functions deploy dcu_api \
            --gen2 \
            --runtime=python311 \
            --region=us-central1 \
            --source=./backend \
            --entry-point=dcu_api \
            --trigger-http \
            --allow-unauthenticated \
            --memory=1GB \
            --timeout=900 \
            --env-vars-file "$RUNNER_TEMP/dcu-api-env.yaml" \
            --project="$GCP_PROJECT_ID"

      # Google Cloud Scheduler jobs for the predictor, because GitHub runs this repo's
      # scheduled workflows only every few hours:
      #   strava-cache-warm  every 15 min: fill the Strava curve cache (75% budget, one at a time)
      #   predictor-worker   every 5 min: process a waiting tuning run, then queued research
      # Both are no-ops when there is nothing to do. Never blocks the deploy: if the deploy
      # service account lacks Cloud Scheduler rights, the step prints what to grant.
      - name: Schedule predictor jobs (Cloud Scheduler)
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          set -u
          REGION=us-central1
          BASE="https://us-central1-dcu-member-liga-479507.cloudfunctions.net/dcu_api"
          gcloud services enable cloudscheduler.googleapis.com --project="$GCP_PROJECT_ID" >/dev/null 2>&1 || true
          failed=0
          schedule_job() {  # name, cron, path, attempt deadline
            local job="$1" cron="$2" path="$3" deadline="$4" action header_flag
            if gcloud scheduler jobs describe "$job" --location="$REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              action=update
              header_flag=--update-headers
            else
              action=create
              header_flag=--headers
            fi
            # Output is discarded so the job config (which holds the token) never reaches the public log.
            if gcloud scheduler jobs "$action" http "$job" \
                --location="$REGION" \
                --project="$GCP_PROJECT_ID" \
                --schedule="$cron" \
                --time-zone="Etc/UTC" \
                --uri="$BASE$path" \
                --http-method=POST \
                "$header_flag"="X-Scheduler-Token=${SCHEDULER_SECRET},Content-Type=application/json" \
                --message-body="{}" \
                --attempt-deadline="$deadline" \
                --quiet >/dev/null 2>"$RUNNER_TEMP/scheduler.err"; then
              echo "Cloud Scheduler job '$job' ${action}d: $cron."
            else
              echo "::warning::Could not ${action} the Cloud Scheduler job '$job'. Grant the deploy service account the 'Cloud Scheduler Admin' role (and enable the Cloud Scheduler API) in Google Cloud IAM, then re-run this workflow."
              grep -v -i "token" "$RUNNER_TEMP/scheduler.err" | tail -5 || true
              failed=1
            fi
          }
          schedule_job strava-cache-warm "*/15 * * * *" /admin/predictor/strava-cache/warm 600s
          schedule_job predictor-worker "*/5 * * * *" /admin/predictor/worker 900s
          exit "$failed"
