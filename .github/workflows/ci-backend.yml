name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # No credentials needed: config.py skips strict validation when CI=true,
    # which GitHub Actions sets automatically on all runners.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Probe Zwift game dictionary
        run: |
          python - <<'PY'
          import requests
          url = "https://www.zwift.com/zwift-web-pages/gamedictionaryextended"
          headers = {"Accept": "application/json", "Source": "zwift-web"}
          try:
              resp = requests.get(url, headers=headers, timeout=20)
          except Exception as exc:
              print(f"FETCH FAILED {type(exc).__name__}: {exc}")
          else:
              body = resp.text[:240].replace("\n", " ")
              print(
                  f"status={resp.status_code} "
                  f"type={resp.headers.get('Content-Type')} "
                  f"bytes={len(resp.content)}"
              )
              print(f"body={body}")
          PY

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
